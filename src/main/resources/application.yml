spring:
  application:
    name: crawlforge
  datasource:
    url: jdbc:h2:file:./data/crawlforge;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: false
      path: /h2-console

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

crawler:
  user-agent: CrawlForge/1.0 (+https://github.com/BigFiiish/crawlforge)
  connect-timeout: 5s
  request-timeout: 12s
  max-body-bytes: 1500000
  max-text-characters: 50000
  max-redirects: 5
  max-attempts: 3
  retry-base-delay: 2s
  allow-private-hosts: false

ai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5.6-luna}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  timeout: 30s
